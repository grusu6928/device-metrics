apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.config.secretName }}
  namespace: {{ include "device-metrics.namespace" . }}
  labels:
    {{- include "device-metrics.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.config.env.DATABASE_URL | quote }}
  SECRET_KEY: {{ .Values.config.env.SECRET_KEY | quote }}
  OPENAI_API_KEY: {{ .Values.config.env.OPENAI_API_KEY | default "" | quote }}
